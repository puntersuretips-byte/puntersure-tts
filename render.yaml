services:
  - type: web
    name: puntersure-tts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_BUCKET
        value: puntersure-audio
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: TTS_VOICE
        value: en-KE-AsiliaNeural
      - key: PUBLIC_BASE
        sync: false
